name: tests

on:
  push:
  pull_request:

# Workflows only need to read the code; nothing here should be able to push.
permissions:
  contents: read

jobs:
  secrets:
    # Fails the build if a password, key or token is committed by mistake.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Real user paths and e-mail addresses. Names are checked locally with
      # .private-patterns, which is never committed.
      - run: python ci/check_private.py

  unit:
    # Fast tests: protocol, listener logic, calculators, knowledge base, MCP server.
    strategy:
      fail-fast: false   # run every combination even if one fails
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q

  freecad:
    # Live tests against real headless FreeCAD (conda-forge build).
    # Pinned so the runner image only changes when we bump it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        freecad: ["1.1"]
    defaults:
      run:
        shell: bash -el {0}
    # Fixed so the failure artifact below always finds the solver files.
    env:
      FREECAD_MCP_WORKDIR: /tmp/freecad_mcp_test_work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          python-version: "3.11"
      # The FEA tests need the CalculiX (ccx) and Gmsh programs. One solve with FreeCAD
      # keeps their libraries compatible and puts both in the env's bin folder, where
      # FreeCAD looks before the PATH. The apt mirror stalled this job more than once.
      - run: conda install -y -c conda-forge "freecad=${{ matrix.freecad }}" calculix gmsh
      - run: pip install -r requirements.txt pytest
      # The unpinned conda packages can change between runs; log what this run got.
      # The FEA tests only skip without ccx or gmsh, so a missing one fails here.
      - name: tool versions
        run: |
          conda list "^(freecad|occt|vtk|python|calculix|gmsh)$"
          for tool in ccx gmsh; do
            found=$(command -v "$tool" || true)
            echo "$tool on PATH: ${found:-none}"
            if [ "$found" != "$CONDA_PREFIX/bin/$tool" ]; then
              echo "::error::$tool is not in the conda env ($CONDA_PREFIX/bin)"
              exit 1
            fi
          done
          # ccx -v always exits with 201, so check what it prints instead.
          ccx_version=$(ccx -v 2>&1 || true)
          echo "$ccx_version"
          grep -q "Version" <<< "$ccx_version" || { echo "::error::ccx -v printed no version"; exit 1; }
          gmsh --version
      - name: start headless listener
        run: |
          FREECAD_MCP_HEADLESS=1 FREECAD_MCP_HEADLESS_CODE=1 nohup freecadcmd -c "import runpy; runpy.run_path('freecad_listener.py', run_name='__main__')" > listener.log 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/9876) 2>/dev/null && break; sleep 1; done
      # Alone first, so an order effect from earlier tests shows up as a difference.
      - run: pytest -q tests/integration -k buckling
      - name: keep the buckling-only solver files
        if: ${{ !cancelled() }}
        run: cp -r /tmp/freecad_mcp_test_work/fea /tmp/fea_buckling_only || true
      - if: ${{ !cancelled() }}
        run: pytest -q tests/integration
      # FEA against analytical answers; about half a minute. Frozen results are per
      # environment, so here only the tolerances are checked until a Linux one is frozen.
      - if: ${{ !cancelled() }}
        run: pytest -q -rs tests/validation
      # Absent when an earlier step failed before the listener started.
      - if: failure()
        run: if [ -f listener.log ]; then cat listener.log; fi
      - name: collect solver files
        if: failure()
        run: |
          mkdir -p /tmp/fea_evidence
          cp -r /tmp/fea_buckling_only /tmp/fea_evidence/buckling_only || true
          cp -r /tmp/freecad_mcp_test_work/fea /tmp/fea_evidence/full_run || true
          cp listener.log /tmp/fea_evidence/ || true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fea-solver-files
          path: /tmp/fea_evidence
          retention-days: 7
          if-no-files-found: warn
