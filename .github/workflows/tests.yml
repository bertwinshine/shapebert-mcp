name: tests

on:
  push:
  pull_request:

# Workflows only need to read the code; nothing here should be able to push.
permissions:
  contents: read

jobs:
  secrets:
    # Fails the build if a password, key or token is committed by mistake.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Real user paths and e-mail addresses. Names are checked locally with
      # .private-patterns, which is never committed.
      - run: python ci/check_private.py

  unit:
    # Fast tests: protocol, listener logic, calculators, knowledge base, MCP server.
    strategy:
      fail-fast: false   # run every combination even if one fails
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q

  freecad:
    # Live tests against real headless FreeCAD (conda-forge build).
    # Pinned so the apt package versions only change when we bump it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        freecad: ["1.1"]
    defaults:
      run:
        shell: bash -el {0}
    # Fixed so the failure artifact below always finds the solver files.
    env:
      FREECAD_MCP_WORKDIR: /tmp/freecad_mcp_test_work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          python-version: "3.11"
      - run: conda install -y -c conda-forge "freecad=${{ matrix.freecad }}"
      # conda-forge FreeCAD has no FEM solver programs; the FEA tests need both. The
      # tests would only skip without them, so check they are really on the PATH.
      # A stalled apt mirror can otherwise hang this step until the job limit.
      - name: install CalculiX and Gmsh
        timeout-minutes: 8
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends calculix-ccx gmsh
          command -v ccx && command -v gmsh
      - run: pip install -r requirements.txt pytest
      # The unpinned conda and apt packages can change between runs; log what this run got.
      # FreeCAD looks for ccx in its own bin folder (the conda env) before the PATH.
      - name: tool versions
        run: |
          conda list "^(freecad|occt|vtk|python|calculix|gmsh)$"
          ls -l "$CONDA_PREFIX/bin/ccx" 2>/dev/null || echo "no ccx in the conda env"
          echo "ccx on PATH: $(command -v ccx)"
          ccx -v | head -3 || true
          echo "gmsh on PATH: $(command -v gmsh)"
          gmsh --version
      - name: start headless listener
        run: |
          FREECAD_MCP_HEADLESS=1 nohup freecadcmd freecad_listener.py > listener.log 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/9876) 2>/dev/null && break; sleep 1; done
      # Alone first, so an order effect from earlier tests shows up as a difference.
      - run: pytest -q tests/integration -k buckling
      - name: keep the buckling-only solver files
        if: ${{ !cancelled() }}
        run: cp -r /tmp/freecad_mcp_test_work/fea /tmp/fea_buckling_only || true
      - if: ${{ !cancelled() }}
        run: pytest -q tests/integration
      - if: failure()
        run: cat listener.log
      - name: collect solver files
        if: failure()
        run: |
          mkdir -p /tmp/fea_evidence
          cp -r /tmp/fea_buckling_only /tmp/fea_evidence/buckling_only || true
          cp -r /tmp/freecad_mcp_test_work/fea /tmp/fea_evidence/full_run || true
          cp listener.log /tmp/fea_evidence/ || true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fea-solver-files
          path: /tmp/fea_evidence
          retention-days: 7
          if-no-files-found: warn
