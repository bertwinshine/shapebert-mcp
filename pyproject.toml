[project]
name = "shapebert-mcp"
version = "1.0.0"
description = "Domain-aware prompt-to-CAD MCP server for FreeCAD (knowledge base, calculators, checks)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["mcp==1.30.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "ERA", "UP", "SIM", "I", "C4", "RET"]
ignore = ["E501", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# Sent to FreeCAD appended to fc_tools.py, whose helpers it uses.
"cadkit/fea_tools.py" = ["F821"]
